---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: swim-sfg-observability
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: dnotam-publisher
        static_configs:
          - targets: ["dnotam-publisher:8080"]
        metrics_path: /q/metrics
      - job_name: dnotam-consumer
        static_configs:
          - targets: ["dnotam-consumer:8081"]
        metrics_path: /metrics
      - job_name: dnotam-originator
        static_configs:
          - targets: ["dnotam-originator:8000"]
        metrics_path: /metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: swim-sfg-observability
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
      containers:
        - name: prometheus
          image: prom/prometheus:v3.2.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --web.enable-lifecycle
          ports:
            - containerPort: 9090
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 500m
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: swim-sfg-observability
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
