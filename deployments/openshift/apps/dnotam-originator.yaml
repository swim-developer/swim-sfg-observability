---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dnotam-originator-config
  namespace: swim-sfg-observability
data:
  PUBLISHER_URL: http://dnotam-publisher:8080
  OTLP_ENDPOINT: http://tempo:4317
  LOKI_OTLP_ENDPOINT: http://loki:3100/otlp/v1/logs
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dnotam-originator
  namespace: swim-sfg-observability
  labels:
    app: dnotam-originator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dnotam-originator
  template:
    metadata:
      labels:
        app: dnotam-originator
    spec:
      containers:
        - name: dnotam-originator
          image: image-registry.openshift-image-registry.svc:5000/swim-sfg-observability/dnotam-originator:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: dnotam-originator-config
          ports:
            - containerPort: 8000
              name: http
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              memory: 128Mi
              cpu: 50m
            limits:
              memory: 256Mi
              cpu: 500m
---
apiVersion: v1
kind: Service
metadata:
  name: dnotam-originator
  namespace: swim-sfg-observability
spec:
  selector:
    app: dnotam-originator
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: dnotam-originator
  namespace: swim-sfg-observability
spec:
  to:
    kind: Service
    name: dnotam-originator
  port:
    targetPort: 8000
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
